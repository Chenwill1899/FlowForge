publish_rate_hz: 20.0
axis_count: 8
button_count: 11
forward_axis: 1
lateral_axis: 0
post_hold_sec: 2.0

# Large figure-8 (infinity) through the 50 x 50 m random arena (see
# complex_3d_arena.yaml): x in [0, 18], y in [-16, 18], with a long middle
# crossing so the trace covers both the upper and lower halves. Long
# axis-aligned segments (the robot sustains ~1.3 m/s through the random
# obstacles; the +x/+y/-y legs are sized for that and overshoot stays inside
# the +-25 m map edge). The keepouts at the corners keep the turns open.
events:
  - {at: 0.0,  forward: 1.0, lateral: 0.0}      # (0,0)->(18,0) 上半圈东行
  - {at: 17.0, forward: 0.0, lateral: 1.0}      # (18,0)->(18,16)
  - {at: 31.0, forward: -1.0, lateral: 0.0}     # (18,16)->(0,16)
  - {at: 46.0, forward: 0.0, lateral: -1.0}     # (0,16)->(0,-16) 中廊下穿
  - {at: 73.0, forward: 1.0, lateral: 0.0}      # (0,-16)->(18,-16) 下半圈东行
  - {at: 88.0, forward: 0.0, lateral: 1.0}      # (18,-16)->(18,0)
  - {at: 101.0, forward: -1.0, lateral: 0.0}    # (18,0)->(0,0) 回起点
  - {at: 116.0, forward: 0.0, lateral: 0.0}     # stop

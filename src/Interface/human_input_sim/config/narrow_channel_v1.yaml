publish_rate_hz: 20.0
axis_count: 8
button_count: 11
forward_axis: 1
lateral_axis: 0
post_hold_sec: 2.0

# Straight +x through the S-corridor (map x in [-2, 18]): 9 s at ~2 m/s
# traverses the two offset gates and stops just before the map edge, so the
# whole run keeps a verified ESDF.
events:
  - {at: 0.0, forward: 1.0, lateral: 0.0}
  - {at: 9.0, forward: 0.0, lateral: 0.0}

name: narrow_channel_2d

# True narrow channel for the 2D human-intent benchmark: two long full-height
# walls with a 2.0 m free gap (walls at y in [-8.8,-1.0] and [1.0,8.8],
# x in [0,10]). The robot drives straight through the gap, then releases in
# the open field beyond. Point spacing 0.2 keeps the PCD ~24k points so the
# ESDF update loop stays healthy (a 0.1-spaced 16 m channel swamped it).
boxes:
  - {center_x: 5.0, center_y: -4.9, thickness_x: 10.0, half_length_y: 3.9,
     z_min: 0.0, z_max: 2.4, point_spacing: 0.2}
  - {center_x: 5.0, center_y: 4.9, thickness_x: 10.0, half_length_y: 3.9,
     z_min: 0.0, z_max: 2.4, point_spacing: 0.2}

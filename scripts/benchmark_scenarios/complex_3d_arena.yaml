name: complex_3d_arena

# SEEDED random 3D field on a 100 x 100 m map boundary (map_size 100, edge
# at +-50 so long loops cannot freeze the robot), with the obstacles
# concentrated in a central 40 x 40 m region. No ground plane: the fluid
# solver's forced floor band (fluid_3d_floor_band) keeps the field from
# commanding into the floor, and the ESDF below the obstacles is simply
# unverified (the CBF degrades there, never trusted).
# Obstacles are rejection-sampled with >= min_gap horizontal clearance
# between vertical blockers (flyable corridors), plus climbable sills /
# pass-under overhangs that place freely: window walls (thread), full/low
# pillars (dodge), tilted pillars, sills (climb), overhangs (pass under).
# Same seed => byte-identical map; CHANGING THE SEED CREATES A NEW
# UNVALIDATED SCENE -- rerun the benchmark before trusting it.
# keepouts clear the spawn and the figure-8 trace's turn corners.
random:
  seed: 20260804
  point_spacing: 0.1
  region: {x_min: -20.0, x_max: 20.0, y_min: -20.0, y_max: 20.0}
  keepout:
    - {x: 0.0, y: 0.0, radius: 3.0}       # spawn
    - {x: 18.0, y: 0.0, radius: 2.5}      # turn corner
    - {x: 18.0, y: 16.0, radius: 2.5}     # turn corner
    - {x: 0.0, y: 16.0, radius: 2.5}      # turn corner
    - {x: 0.0, y: -16.0, radius: 2.5}     # turn corner
    - {x: 18.0, y: -16.0, radius: 2.5}    # turn corner
  min_gap: 1.4
  z_base: 0.05
  z_top: 3.35
  window_walls: {count: 4, half_length: [2.0, 3.0], window_width: 1.6,
                 window_z: [1.1, 2.5]}
  pillars: {count: 24, radius: [0.25, 0.45], full_height_ratio: 0.7,
            low_height: [1.4, 2.2]}
  tilted_pillars: {count: 10, radius: [0.2, 0.32], tilt_deg: [12, 28]}
  sills: {count: 8, height: [0.3, 0.6], half_length: [1.5, 2.8],
          thickness: [0.2, 0.4]}
  overhangs: {count: 6, z_min: [1.6, 2.0], depth: [0.6, 1.2],
              half_length: [1.0, 2.2], thickness: [0.3, 0.6]}

validation:
  mode: course
  d_s: 0.30
  cruise_z: 1.0
  course_end_x: 16.0            # the figure-8 loop reaches x ~ 18-25 (no map edge now)
  return_window_s: 2.0
  return_z_tolerance: 0.25
  max_z: 3.0
  min_z: 0.30
  max_command_vz: 1.3
  max_command_speed: 2.05
  post_release_max_command_speed: 0.05
  max_stall_s: 2.5

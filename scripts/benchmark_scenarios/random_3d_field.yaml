name: random_3d_field

# pillar.pcd-sized (~27 x 14 m footprint, long axis on +x) SEEDED random 3D
# field: vertical pillars (mixed full/low height), tilted pillars, a wall
# with a window, floating overhangs and low sills. Same seed => byte-identical
# map, so the benchmark stays reproducible; CHANGING THE SEED CREATES A NEW
# UNVALIDATED SCENE -- rerun the benchmark before trusting it. Vertical
# blockers keep >= min_gap horizontal clearance between bounding circles
# (flyable corridors); sills/overhangs are crossed vertically and place
# freely. The spawn keepout protects the start at (0,0).
# Needs test_gvf_3d.launch.
random:
  seed: 20260726
  point_spacing: 0.1
  region: {x_min: 2.0, x_max: 20.0, y_min: -6.0, y_max: 6.0}
  keepout:
    - {x: 0.0, y: 0.0, radius: 2.0}
  min_gap: 1.4
  z_base: 0.05
  z_top: 3.35
  window_walls: {count: 1, half_length: [2.0, 3.0], window_width: 1.6,
                 window_z: [0.7, 2.1]}
  pillars: {count: 9, radius: [0.25, 0.45], full_height_ratio: 0.7,
            low_height: [1.4, 2.2]}
  tilted_pillars: {count: 4, radius: [0.2, 0.32], tilt_deg: [12, 28]}
  sills: {count: 3, height: [0.3, 0.6], half_length: [1.5, 2.8],
          thickness: [0.2, 0.4]}
  overhangs: {count: 3, z_min: [1.6, 2.0], depth: [0.6, 1.2],
              half_length: [1.0, 2.2], thickness: [0.3, 0.6]}

# Extra full-height pillars filling the tile's central y-band (y in
# [-3.5, 3.5]): the base tile's corridor along the flight line was too
# sparse. They replicate and rotate with the copies; the two at x=11.0 sit
# on the tile's rotation center, so they stay in every copy's y-band no
# matter the rot_deg. (The spawn keepout at (0,0) still clears the launch
# area; the window passage at x ~ 14-16, y in [0.2, 1.8] stays open.)
absolute_pillars:
  # y-band fill along the tile's flight corridor -- randomized but with
  # bounded jitter/radius so the 2 m spacing never collapses into a
  # bottleneck on the flight line. The spawn crossroad x in [-2,2] is left
  # clear (keepout r2.0) so the launch is never obstructed.
  - {center_x: 5.0, center_y: 0.0, radius: 0.30, z_min: 0.0, z_max: 3.2,
     point_spacing: 0.2, jitter: 0.35, radius_min: 0.28, radius_max: 0.40,
     full_height_ratio: 0.8, tilt_deg: [0.0, 15.0], seed: 21}
  - {center_x: 7.0, center_y: 0.0, radius: 0.30, z_min: 0.0, z_max: 3.2,
     point_spacing: 0.2, jitter: 0.35, radius_min: 0.28, radius_max: 0.40,
     full_height_ratio: 0.8, tilt_deg: [0.0, 15.0], seed: 22}
  - {center_x: 9.0, center_y: 0.0, radius: 0.30, z_min: 0.0, z_max: 3.2,
     point_spacing: 0.2, jitter: 0.35, radius_min: 0.28, radius_max: 0.40,
     full_height_ratio: 0.8, tilt_deg: [0.0, 15.0], seed: 23}
  - {center_x: 10.8, center_y: 0.0, radius: 0.30, z_min: 0.0, z_max: 3.2,
     point_spacing: 0.2, jitter: 0.35, radius_min: 0.28, radius_max: 0.40,
     full_height_ratio: 0.8, tilt_deg: [0.0, 15.0], seed: 24}
  - {center_x: 12.5, center_y: 0.0, radius: 0.30, z_min: 0.0, z_max: 3.2,
     point_spacing: 0.2, jitter: 0.35, radius_min: 0.28, radius_max: 0.40,
     full_height_ratio: 0.8, tilt_deg: [0.0, 15.0], seed: 25}
  - {center_x: 17.0, center_y: 0.0, radius: 0.30, z_min: 0.0, z_max: 3.2,
     point_spacing: 0.2, jitter: 0.35, radius_min: 0.28, radius_max: 0.40,
     full_height_ratio: 0.8, tilt_deg: [0.0, 15.0], seed: 26}
  - {center_x: 11.0, center_y: -3.2, radius: 0.30, z_min: 0.0, z_max: 3.2,
     point_spacing: 0.2, jitter: 0.35, radius_min: 0.28, radius_max: 0.40,
     full_height_ratio: 0.8, tilt_deg: [0.0, 15.0], seed: 27}
  - {center_x: 11.0, center_y: 3.2, radius: 0.30, z_min: 0.0, z_max: 3.2,
     point_spacing: 0.2, jitter: 0.35, radius_min: 0.28, radius_max: 0.40,
     full_height_ratio: 0.8, tilt_deg: [0.0, 15.0], seed: 28}

# Whole-scene copies for joystick free flight, laid out as a 3 x 2 grid so
# the spawn at (0,0) sits at a central crossroads with terrain on every
# side. Each copy is ROTATED about its own center by a different rot_deg
# (0/30/-30/60/-60/90) so the field does not look like six identical blocks;
# the middle row (y ~ 0) keeps two copies so the y=0 band is filled. Tile
# centers: (11,0), (-11,0), (11,+/-15), (-11,+/-15); with rotation the
# bounding boxes overlap a little between rows -- acceptable, the field is
# intentionally dense (the min_gap guarantee is per copy).
# NOTE: the base tile (rot 0, dx 0) is byte-identical to the validated seed;
# the rotated copies are new and need a benchmark run before trusting them.
replicas:
  - {dx: 0.0, dy: 0.0, rot_deg: 0.0}        # center-east, the validated tile
  - {dx: -22.0, dy: 0.0, rot_deg: 30.0}     # center-west
  - {dx: 0.0, dy: 12.0, rot_deg: -30.0}     # top (pulled in from +15 so the
                                            # upper band meets the middle row)
  - {dx: -22.0, dy: 12.0, rot_deg: 60.0}    # top-left
  - {dx: 0.0, dy: -12.0, rot_deg: -60.0}    # bottom
  - {dx: -22.0, dy: -12.0, rot_deg: 90.0}   # bottom-left

# Absolute filler (not replicated): plugs the ragged-edge holes of the
# rotated tile block with lattices whose points are RANDOMIZED (jittered
# positions, varied radius/height, some tilted) so the fill looks organic.
absolute_pillar_grid:
  # south-center void (x[-4,8], y[-24,-6])
  - {x_min: -3.0, x_max: 7.0, y_min: -23.0, y_max: -7.0, spacing: 2.0,
     radius: 0.35, z_min: 0.0, z_max: 3.2, point_spacing: 0.2,
     seed: 101, jitter: 0.8, radius_min: 0.25, radius_max: 0.45,
     full_height_ratio: 0.75, tilt_deg: [0.0, 20.0]}
  # east strip void (x[14,24], y[-24,10]) -- split to leave the flight
  # corridor y in [-3,3] open (a 2 m grid there boxed the robot in)
  - {x_min: 15.0, x_max: 23.0, y_min: -23.0, y_max: -3.0, spacing: 2.0,
     radius: 0.35, z_min: 0.0, z_max: 3.2, point_spacing: 0.2,
     seed: 102, jitter: 0.8, radius_min: 0.25, radius_max: 0.45,
     full_height_ratio: 0.75, tilt_deg: [0.0, 20.0]}
  - {x_min: 15.0, x_max: 23.0, y_min: 3.0, y_max: 9.0, spacing: 2.0,
     radius: 0.35, z_min: 0.0, z_max: 3.2, point_spacing: 0.2,
     seed: 103, jitter: 0.8, radius_min: 0.25, radius_max: 0.45,
     full_height_ratio: 0.75, tilt_deg: [0.0, 20.0]}
  # west-top void (x[-24,-14], y[6,24])
  - {x_min: -23.0, x_max: -15.0, y_min: 7.0, y_max: 23.0, spacing: 2.0,
     radius: 0.35, z_min: 0.0, z_max: 3.2, point_spacing: 0.2,
     seed: 104, jitter: 0.8, radius_min: 0.25, radius_max: 0.45,
     full_height_ratio: 0.75, tilt_deg: [0.0, 20.0]}
  # east-top void (x[6,24], y[14,24])
  - {x_min: 7.0, x_max: 23.0, y_min: 15.0, y_max: 23.0, spacing: 2.0,
     radius: 0.35, z_min: 0.0, z_max: 3.2, point_spacing: 0.2,
     seed: 105, jitter: 0.8, radius_min: 0.25, radius_max: 0.45,
     full_height_ratio: 0.75, tilt_deg: [0.0, 20.0]}
  # west-bottom void (x[-24,-18], y[-24,-16])
  - {x_min: -23.0, x_max: -19.0, y_min: -23.0, y_max: -17.0, spacing: 2.0,
     radius: 0.35, z_min: 0.0, z_max: 3.2, point_spacing: 0.2,
     seed: 106, jitter: 0.8, radius_min: 0.25, radius_max: 0.45,
     full_height_ratio: 0.75, tilt_deg: [0.0, 20.0]}
  # north-center void (x[-4,2], y[8,12])
  - {x_min: -3.0, x_max: 1.0, y_min: 9.0, y_max: 11.0, spacing: 2.0,
     radius: 0.35, z_min: 0.0, z_max: 3.2, point_spacing: 0.2,
     seed: 107, jitter: 0.8, radius_min: 0.25, radius_max: 0.45,
     full_height_ratio: 0.75, tilt_deg: [0.0, 20.0]}
  # west-bottom extension void (x[-24,-18], y[-16,-10])
  - {x_min: -23.0, x_max: -19.0, y_min: -15.0, y_max: -11.0, spacing: 2.0,
     radius: 0.35, z_min: 0.0, z_max: 3.2, point_spacing: 0.2,
     seed: 108, jitter: 0.8, radius_min: 0.25, radius_max: 0.45,
     full_height_ratio: 0.75, tilt_deg: [0.0, 20.0]}
  # north edge void (x[-8,0], y[20,24])
  - {x_min: -7.0, x_max: -1.0, y_min: 21.0, y_max: 23.0, spacing: 2.0,
     radius: 0.35, z_min: 0.0, z_max: 3.2, point_spacing: 0.2,
     seed: 109, jitter: 0.8, radius_min: 0.25, radius_max: 0.45,
     full_height_ratio: 0.75, tilt_deg: [0.0, 20.0]}

validation:
  mode: course
  d_s: 0.30
  cruise_z: 2.0
  course_end_x: 20.5            # past the last obstacle at x ~ 18-19 (map edge +50)
  return_window_s: 2.0
  return_z_tolerance: 0.25
  max_z: 3.0
  min_z: 0.30
  max_command_vz: 1.3
  max_command_speed: 2.05
  post_release_max_command_speed: 0.05
  max_stall_s: 2.5
